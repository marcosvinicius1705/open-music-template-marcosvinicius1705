<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/globalStyles.css">
    <script defer src="scripts/index.js"></script>
    <script defer src="scripts/albumsDatabase.js"></script>
    <script defer src="scripts/theme.js"></script>
    
    <title>Open Music</title>
  </head>
  <body>
   
    <header>
        <div class="header">
            <h1>
                <span>o</span>pen <span>m</span>usic
            </h1>
            <img class="sun" id="themeIcon" src="assets/icon/sun-icon.svg" aria-label="Alternar tema"/>
        </div>
        <hr> 
    </header>

    <main>
      <section>
        <h3>Gênero Musical</h3>
        <div class="musicalGenre">
            <ul>
                <li>Todos</li>
                <li>Pop</li>
                <li>MPB</li>
                <li>Forró</li>
                <li>Samba</li>
                <li>Bailão</li>
                <li>Rap</li>
                <li>Hip-Hop</li>
            </ul>
        </div>
      </section>

      <section>
        <div class="price">
            <h3>Definir preço</h3>
            <h3>
                Até <span class="price-number">R$ 150</span>
            </h3>
        </div>
        <input type="range" id="inputPrice" name="price" min="0" max="150" value="150">
      </section>

      <section>
        <h3>Albuns Encontrados</h3>
        <div class="albumsContainer">
      </section>

    </main>
  
  </body>
</html>
